<!doctype html>
<!-- Generic animation engine for EXPLAINER videos. It contains NO animation of its own: every look (flow, compare, steps, stat,
     bits, cells, ring, ...) is described in its own animation_<name>.json file and drawn here. The pipeline passes the chosen animation's description
     as window.__PARAMS__.spec, plus the scene's own values (labels, bits, caption ...) as the other __PARAMS__ fields.
     Everything is driven by setTime(t) (seconds), so frames are exact. See animation_README.md for the JSON format. -->
<html><head><meta charset="utf-8">
<style>
  html, body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; }
  body { font-family:"Segoe UI",system-ui,sans-serif; color:#fff; }
  #stage { position:absolute; left:0; top:0; width:100%; display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:3vh; }
  h1 { margin:0; font-size:6.4vh; font-weight:700; text-align:center; text-shadow:0 .4vh 1.6vh rgba(0,0,0,.65); }
  #content { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
             gap:3vh; min-height:0; width:100%; }
  /* ready-made looks an animation can use through "class": */
  .row { display:flex; align-items:center; justify-content:center; width:100%; }
  .card { box-sizing:border-box; padding:1.6vh 1.4vw; border-radius:2vh; text-align:center; font-weight:600;
          background:rgba(14,22,44,.78); border:.4vh solid var(--c,#4aa8ff); color:#fff;
          box-shadow:0 0 2.4vh var(--c,#4aa8ff), inset 0 0 1.6vh rgba(255,255,255,.06); }
  .cap { font-size:3.4vh; color:#e6edf7; text-align:center; text-shadow:0 .3vh 1.2vh rgba(0,0,0,.7); }
  .link { position:relative; height:.7vh; background:rgba(255,255,255,.28); border-radius:1vh; }
  .link::after { content:""; position:absolute; right:-.2vh; top:50%; width:1.7vh; height:1.7vh;
                 border-top:.7vh solid rgba(255,255,255,.7); border-right:.7vh solid rgba(255,255,255,.7);
                 transform:translateY(-50%) rotate(45deg); }
  .sp { position:absolute; width:1.3vh; height:1.3vh; margin:-.65vh 0 0 -.65vh; border-radius:50%; background:#cfeaff;
        box-shadow:0 0 1vh #7cc8ff; }
  .pulse { position:absolute; width:3vh; height:3vh; margin:-1.5vh 0 0 -1.5vh; border-radius:50%; background:#fff;
           box-shadow:0 0 2vh 1vh rgba(120,200,255,.9); pointer-events:none; }
  .pt { font-size:3.2vh; font-weight:500; padding:1vh 1.2vw; margin-top:1.2vh; border-radius:1.4vh;
        background:rgba(255,255,255,.08); }
  .num { width:6.4vh; height:6.4vh; border-radius:50%; display:flex; align-items:center; justify-content:center;
         font-size:3.6vh; font-weight:700; background:var(--c); color:#0b1226; flex:0 0 auto; }
  svg text { font-family:inherit; }
</style></head>
<body><div id="stage"><h1 id="h"></h1><div id="content"></div></div>
<script>
const P = Object.assign({heading:"", duration:20, vertical:false, sub_margin:0.16, safe_w:0.88, spec:null},
                        window.__PARAMS__ || {});
const SPEC = P.spec || {};
const SVGNS = "http://www.w3.org/2000/svg";
const SVG_TAGS = new Set(["svg","g","path","circle","rect","line","polygon","polyline","ellipse","text","tspan","defs","linearGradient","stop"]);

// ---------------------------------------------------------------- helpers available inside every expression
const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x,0),1), 3);
const clamp = (x,a,b) => Math.min(Math.max(x,a),b);
const lerp = (a,b,k) => a + (b-a)*k;
const COLORS = ["#4aa8ff","#2ee6c5","#ffb347","#ff6b9d","#a78bfa"];
const T_IN = 0.6;                                   // title fade-in, seconds
const V = !!P.vertical;
function list(v, dflt, max) {                       // accepts an array or "a, b, c"
  if (typeof v === "string") v = v.split(/[;,]/);
  if (!Array.isArray(v)) v = [];
  v = v.map(x => (x && typeof x === "object") ? x : String(x).trim()).filter(x => x !== "");
  return (v.length ? v : dflt).slice(0, max);
}
function bitsOf(v, dflt, max) { const b = String(v || "").replace(/[^01]/g, ""); return (b || dflt).slice(0, max); }
const num = v => parseFloat(String(v).replace(/[^0-9.\-]/g, "")) || 0;
const decimals = v => (String(v).split(".")[1] || "").length;
const bob = (t, i, amp = 0.7) => Math.sin(t * 1.6 + i * 1.3) * amp;               // gentle float, in vh
const sheen = (t, i) => {                                                         // light band sweeping across a card
  const p = ((t * 38 + i * 45) % 170) - 35, base = "rgba(14,22,44,.78)";
  return `linear-gradient(110deg, ${base} ${p-18}%, rgba(255,255,255,.16) ${p}%, ${base} ${p+18}%)`;
};
const refs = {};                                    // every node with an "id" is listed here: refs.card[0], refs.card[1] ...
const mid = (el, rel) => {                          // centre of el, in pixels relative to the element rel
  const a = el.getBoundingClientRect(), r = rel.getBoundingClientRect();
  return {x: a.left + a.width/2 - r.left, y: a.top + a.height/2 - r.top};
};

// ---------------------------------------------------------------- expressions
const src = v => Array.isArray(v) ? v.join(" ") : String(v);
const cache = {};
function compile(code) {
  return cache[code] || (cache[code] = new Function("c", "with (c) { return (" + code + "\n); }"));
}
const run = (code, ctx) => { try { return compile(src(code))(ctx); } catch (e) { console.log("[animator] error in `" + src(code) + "`: " + e.message); return undefined; } };
const interp = (s, ctx) => {                        // "text {{expr}} more" -> evaluated; a lone {{expr}} keeps its type
  s = src(s);
  const m = s.match(/^\{\{([\s\S]*)\}\}$/);
  if (m && !m[1].includes("{{")) { const v = run(m[1], ctx); return v === undefined ? "" : v; }
  return s.replace(/\{\{([\s\S]*?)\}\}/g, (_, e) => { const v = run(e, ctx); return v === undefined ? "" : v; });
};

// ---------------------------------------------------------------- build the page from the spec
const root = Object.create({ ease, clamp, lerp, COLORS, T_IN, V, P, list, bitsOf, num, decimals, bob, sheen, refs, mid, Math });
root.t = 0;
const live = [];                                    // every node instance that must be updated each frame

function setStyle(el, key, val) {
  val = (val === undefined || val === null) ? "" : String(val);
  if (key.includes("-")) el.style.setProperty(key, val); else el.style[key] = val;
}
function setAttrs(el, attrs, ctx) {
  for (const k in (attrs || {})) el.setAttribute(k, String(interp(attrs[k], ctx)));
}
function expand(v, ctx) {                           // "each": an array, a number (0..n-1) or an expression for one
  let a = run(v, ctx);
  if (typeof a === "number") a = Array.from({length: Math.max(0, Math.floor(a))}, (_, i) => i);
  return Array.isArray(a) ? a : [];
}

function build(node, parent, ctx, inSvg) {
  if (node.if !== undefined && !run(node.if, ctx)) return;
  if (node.each !== undefined) {
    const items = expand(node.each, ctx), iName = node.index || "i", vName = node.as || "item";
    items.forEach((item, i) => {
      const c = Object.create(ctx); c[iName] = i; c[vName] = item;
      if (iName !== "i" && !node.index) c.i = i;
      buildOne(node, parent, c, inSvg);
    });
  } else buildOne(node, parent, ctx, inSvg);
}

function buildOne(node, parent, ctx, inSvg) {
  for (const k in (node.vars || {})) ctx[k] = run(node.vars[k], ctx);          // computed once
  const inst = {ctx, node, frame: node.frame || null, bind: node.bind || null, el: null};
  let host = parent;
  if (node.tag !== "fragment") {
    const tag = node.tag || "div";
    const isSvg = tag === "svg" || inSvg;               // everything inside an <svg> is an SVG element
    const el = isSvg ? document.createElementNS(SVGNS, tag) : document.createElement(tag);
    if (node.class) el.setAttribute("class", node.class);
    setAttrs(el, node.attrs, ctx);
    for (const k in (node.style || {})) setStyle(el, k, interp(node.style[k], ctx));
    if (node.text !== undefined) el.textContent = String(interp(node.text, ctx));
    parent.appendChild(el);
    inst.el = el; host = el;
    if (node.id) (refs[node.id] = refs[node.id] || []).push(el);
    inSvg = isSvg;
  }
  live.push(inst);
  (node.children || []).forEach(ch => build(ch, host, ctx, inSvg));
}

const content = document.getElementById("content"), stage = document.getElementById("stage");
stage.style.height = (100 * (1 - P.sub_margin)) + "%";
content.style.width = (100 * P.safe_w) + "%";
document.getElementById("h").textContent = P.heading || "";

for (const k in (SPEC.setup || {})) root[k] = run(SPEC.setup[k], root);         // computed once, in order
(SPEC.tree || []).forEach(n => build(n, content, root, false));

function applyBinds(inst) {
  const b = inst.bind, el = inst.el;
  if (!b || !el) return;
  for (const key in b) {
    const v = run(b[key], inst.ctx);
    if (key === "text") el.textContent = v === undefined ? "" : String(v);
    else if (key.startsWith("style.")) setStyle(el, key.slice(6), v);
    else if (key.startsWith("attr.")) el.setAttribute(key.slice(5), String(v));
  }
}

window.setTime = function (t) {
  root.t = t;
  document.getElementById("h").style.opacity = SPEC.heading === false ? 0 : ease(t / T_IN);   // "heading": false in the spec hides the title
  for (const k in (SPEC.frame || {})) root[k] = run(SPEC.frame[k], root);       // global per-frame values, in order
  for (const inst of live) {                                                    // parents come before their children
    for (const k in (inst.frame || {})) inst.ctx[k] = run(inst.frame[k], inst.ctx);
    applyBinds(inst);
  }
};
window.setTime(0);
</script></body></html>
